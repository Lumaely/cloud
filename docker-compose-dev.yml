services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-Admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-LumaelyPasswordChangeMePlz}
      POSTGRES_DB: ${DB_NAME:-Lumaely-db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  s3:
    image: dxflrs/garage:v1.0.1
    restart: always
    command: /garage server
    ports:
      - "3900:3900"
    environment:
      - GARAGE_RPC_SECRET=c1f4e1f7d54b2a6f8e3c1b5a9d2e4f7a8b6c3d1e2f4a5b6c7d8e9f0a1b2c3d4e
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DB_HOST: db
      MINIO_ENDPOINT: s3:4566
    depends_on:
      - db
      - s3

volumes:
  postgres_data:
  garage_meta:
  garage_data: