# Distinct project names keep dev and prod containers and volumes apart.
name: lumaely-dev

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-Admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-LumaelyPasswordChangeMePlz}
      POSTGRES_DB: ${DB_NAME:-Lumaely-db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    # Upstream minio/minio is archived; pgsty/minio is its maintained fork.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      MINIO_ENDPOINT: s3:9000
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
