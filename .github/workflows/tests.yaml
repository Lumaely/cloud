name: Tests

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'Lumaely/cloud'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lumaely_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d lumaely_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/lumaely_test?sslmode=disable
      MINIO_TEST_ENDPOINT: localhost:9000
      MINIO_TEST_ACCESS_KEY: minioadmin
      MINIO_TEST_SECRET_KEY: minioadmin
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Service containers cannot pass `server /data`, so MinIO is started by hand.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=$MINIO_TEST_ACCESS_KEY \
            -e MINIO_ROOT_PASSWORD=$MINIO_TEST_SECRET_KEY \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do
            curl -fs http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1
