services:
    db:
      image: postgres:17-alpine
      restart: always
      environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: ${DB_NAME}
      volumes:
        - postgres_data:/var/lib/postgresql/data

    app:
      build:
        context: .
        dockerfile: Dockerfile
      ports:
        - "8080:8080"
      volumes:
        - .:/app
      env_file:
        - .env
      depends_on:
        - db

volumes:
  postgres_data: