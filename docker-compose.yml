# Distinct project names keep dev and prod containers and volumes apart.
name: lumaely

services:
    db:
      image: postgres:17-alpine
      restart: always
      environment:
        POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
        POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
        POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 10

    s3:
      # Upstream minio/minio is archived; pgsty/minio is its maintained fork.
      image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
      restart: always
      command: server /data
      environment:
        MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
        MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      volumes:
        - minio_data:/data
      healthcheck:
        test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
        interval: 5s
        timeout: 5s
        retries: 10

    app:
      # Built by src/scripts/build_prod; never pulled.
      image: lumaely-cloud:${LUMAELY_VERSION:-latest}
      pull_policy: never
      restart: always
      ports:
        - "8080:8080"
      env_file:
        - .env
      environment:
        SERVER_SECRET: ${SERVER_SECRET:?set SERVER_SECRET in .env}
        # Host-only settings; the container uses DB_* and its built-in migrations.
        DATABASE_URL: ""
        MIGRATIONS_DIR: ""
        DB_HOST: db
        DB_PORT: 5432
        MINIO_ENDPOINT: s3:9000
      depends_on:
        db:
          condition: service_healthy
        s3:
          condition: service_healthy

volumes:
  postgres_data:
  minio_data:
