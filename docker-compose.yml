services:
    db:
      image: postgres:17-alpine
      restart: always
      environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: ${DB_NAME}
      volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./db/init:/docker-entrypoint-initdb.d
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 10

    s3:
      # Upstream minio/minio is archived; pgsty/minio is its maintained fork.
      image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
      restart: always
      command: server /data
      environment:
        MINIO_ROOT_USER: ${MINIO_ROOT_USER}
        MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      volumes:
        - minio_data:/data
      healthcheck:
        test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
        interval: 5s
        timeout: 5s
        retries: 10

    app:
      build:
        context: .
        dockerfile: Dockerfile
      restart: always
      ports:
        - "8080:8080"
      env_file:
        - .env
      environment:
        DB_HOST: db
        DB_PORT: 5432
        MINIO_ENDPOINT: s3:9000
      depends_on:
        db:
          condition: service_healthy
        s3:
          condition: service_healthy

volumes:
  postgres_data:
  minio_data:
